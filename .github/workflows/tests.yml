name: JWT Inspector Security Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jwt-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          python -m py_compile jwt_inspector.py test_jwt_inspector.py

      - name: Run JWT inspector tests
        run: |
          python -m unittest -v test_jwt_inspector.py
